spring.application.name=shopeasy
server.port=8080

# Database (override with environment variables in Docker / production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long-123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS + seed admin
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

management.endpoints.web.exposure.include=health
