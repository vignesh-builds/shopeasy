services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: please-change-this-to-a-long-random-string-in-production-123
      CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8080/api }
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  pgdata:
